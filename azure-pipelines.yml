trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  nodeVersion: "20.x"
  webAppPackagePath: "packages/web-app"
  terraformWorkingDirectory: "infra/terraform"
  # Replace with the Azure DevOps service connection created in the manual prerequisites.
  azureServiceConnection: "StampGenerator-Azure"
  # Replace with bootstrap storage account details after running infra/bootstrap.
  terraformBackendResourceGroup: "stampgen-tfstate-rg"
  terraformBackendStorageAccount: "stampgentfstate"
  terraformBackendContainer: "tfstate"

stages:
  - stage: Lint
    displayName: Lint
    jobs:
      - job: Lint
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
            displayName: Use Node.js
          - script: npm ci
            displayName: Install dependencies
          - script: npm run lint
            displayName: Run ESLint

  - stage: UnitTest
    displayName: Unit test
    dependsOn: Lint
    jobs:
      - job: UnitTest
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
            displayName: Use Node.js
          - script: npm ci
            displayName: Install dependencies
          - script: npm test
            displayName: Run unit tests

  - stage: Build
    displayName: Build
    dependsOn: UnitTest
    jobs:
      - job: Build
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
            displayName: Use Node.js
          - script: npm ci
            displayName: Install dependencies
          - script: npm run build
            displayName: Build packages
          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: "$(webAppPackagePath)/dist"
              artifact: "web-app"
            displayName: Publish web-app artifact

  - stage: TerraformPlan
    displayName: Terraform plan
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - job: TerraformPlan
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: "1.9.8"
            displayName: Install Terraform
          - task: AzureCLI@2
            displayName: Terraform init and plan
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: $(terraformWorkingDirectory)
              inlineScript: |
                set -euo pipefail
                terraform init \
                  -backend-config="resource_group_name=$(terraformBackendResourceGroup)" \
                  -backend-config="storage_account_name=$(terraformBackendStorageAccount)" \
                  -backend-config="container_name=$(terraformBackendContainer)" \
                  -backend-config="key=stamp-generator.dev.tfstate"
                terraform plan \
                  -var="environment=dev" \
                  -out=tfplan

  - stage: TerraformApply
    displayName: Terraform apply
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: TerraformApply
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: "1.9.8"
            displayName: Install Terraform
          - task: AzureCLI@2
            displayName: Terraform init and apply
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: $(terraformWorkingDirectory)
              inlineScript: |
                set -euo pipefail
                terraform init \
                  -backend-config="resource_group_name=$(terraformBackendResourceGroup)" \
                  -backend-config="storage_account_name=$(terraformBackendStorageAccount)" \
                  -backend-config="container_name=$(terraformBackendContainer)" \
                  -backend-config="key=stamp-generator.prod.tfstate"
                terraform apply -auto-approve -var="environment=prod"

  - stage: DeploySwa
    displayName: Deploy Static Web App
    dependsOn:
      - Build
      - TerraformApply
    condition: |
      and(
        succeeded('Build'),
        or(
          eq(variables['Build.Reason'], 'PullRequest'),
          and(succeeded('TerraformApply'), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
        )
      )
    jobs:
      - job: DeploySwa
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: DownloadPipelineArtifact@2
            inputs:
              artifact: "web-app"
              path: "$(Pipeline.Workspace)/web-app"
            displayName: Download web-app artifact
          - task: AzureStaticWebApp@0
            name: DeployStaticWebApp
            displayName: Deploy to Azure Static Web Apps
            inputs:
              app_location: "$(Pipeline.Workspace)/web-app"
              skip_app_build: true
              skip_api_build: true
              # Set this secret in the Azure DevOps variable group after terraform apply.
              azure_static_web_apps_api_token: $(AZURE_STATIC_WEB_APPS_API_TOKEN)
            env:
              # Enables PR preview environments when the build reason is PullRequest.
              DEPLOYMENT_ENVIRONMENT: $[coalesce(variables['System.PullRequest.PullRequestId'], 'production')]
